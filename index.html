<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Test Canvas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f4f0;font-family:sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
#info{padding:10px 16px;background:#fff;border-bottom:1px solid #e0ddd6;font-size:13px;color:#666}
#board{flex:1;position:relative;overflow:hidden;background:#f5f4f0}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.node{position:absolute;background:#fff;border:1px solid #e0ddd6;border-radius:10px;padding:12px 16px;cursor:grab;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.node:active{cursor:grabbing}
</style>
</head>
<body>
<div id="info">Glisser le fond = déplacer · Molette = zoom · Glisser bulle = déplacer bulle</div>
<div id="board">
  <div id="canvas">
    <svg style="position:absolute;top:0;left:0;overflow:visible;pointer-events:none" id="svg"></svg>
    <div class="node" id="n1" style="left:100px;top:100px">📍 Point de départ</div>
    <div class="node" id="n2" style="left:280px;top:80px">🎬 Vidéo technique</div>
    <div class="node" id="n3" style="left:200px;top:220px">📝 Note</div>
  </div>
</div>
<script>
let vx=0,vy=0,vz=1;
let panState=null,dragState=null;

const board=document.getElementById('board');
const canvas=document.getElementById('canvas');

function applyT(){
  canvas.style.transform='translate3d('+vx+'px,'+vy+'px,0) scale('+vz+')';
}
function zoomAt(px,py,factor){
  const nz=Math.min(3,Math.max(0.1,vz*factor));
  vx=px-(px-vx)*(nz/vz);
  vy=py-(py-vy)*(nz/vz);
  vz=nz;
  applyT();
}

// Pan sur le fond
board.addEventListener('pointerdown',e=>{
  if(e.button!==0) return;
  if(e.target.closest('.node')) return;
  e.preventDefault();
  panState={sx:e.clientX-vx,sy:e.clientY-vy};
  board.style.cursor='grabbing';
  board.setPointerCapture(e.pointerId);
});
board.addEventListener('pointermove',e=>{
  if(dragState){
    e.preventDefault();
    const b=board.getBoundingClientRect();
    const el=document.getElementById(dragState.id);
    const x=(e.clientX-b.left-vx)/vz-dragState.ox;
    const y=(e.clientY-b.top-vy)/vz-dragState.oy;
    el.style.left=x+'px';
    el.style.top=y+'px';
    return;
  }
  if(panState){
    e.preventDefault();
    vx=e.clientX-panState.sx;
    vy=e.clientY-panState.sy;
    applyT();
  }
});
board.addEventListener('pointerup',()=>{
  if(dragState){dragState=null;board.style.cursor='default';return;}
  if(panState){panState=null;board.style.cursor='default';}
});
board.addEventListener('wheel',e=>{
  e.preventDefault();
  const b=board.getBoundingClientRect();
  zoomAt(e.clientX-b.left,e.clientY-b.top,e.deltaY<0?1.1:1/1.1);
},{passive:false});

// Drag des noeuds
document.querySelectorAll('.node').forEach(el=>{
  el.addEventListener('pointerdown',e=>{
    if(e.button!==0) return;
    e.preventDefault();
    e.stopPropagation();
    const b=board.getBoundingClientRect();
    const x=parseInt(el.style.left);
    const y=parseInt(el.style.top);
    dragState={id:el.id, ox:(e.clientX-b.left-vx)/vz-x, oy:(e.clientY-b.top-vy)/vz-y};
    board.setPointerCapture(e.pointerId);
    board.style.cursor='grabbing';
  });
});
</script>
</body>
</html>
